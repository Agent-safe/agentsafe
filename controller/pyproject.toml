[project]
name = "agentsafe-controller"
version = "0.1.0"
description = "Local authorization controller and cryptographic audit journal for AgentSafe"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "cryptography>=44,<47",
  "langgraph>=0.3,<2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "pytest>=8.4.2",
]
